name: macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools and PHP dependencies
        run: |
          brew update
          brew install cmake ninja curl libzip dylibbundler

      - name: Download PHP and library sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p php-arm64
          cd php-arm64
          curl -fL --retry 3 -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz
          curl -fL --retry 3 -o libiconv.tar.gz https://ftp.gnu.org/gnu/libiconv/libiconv-1.18.tar.gz
          curl -fL --retry 3 -o libxml2.tar.xz https://download.gnome.org/sources/libxml2/2.14/libxml2-2.14.6.tar.xz
          curl -fL --retry 3 -o zlib.tar.gz https://zlib.net/fossils/zlib-1.3.1.tar.gz
          curl -fL --retry 3 -o sqlite.tar.gz https://www.sqlite.org/2025/sqlite-autoconf-3500400.tar.gz
          curl -fL --retry 3 -o libpng.tar.gz https://download.sourceforge.net/libpng/libpng-1.6.50.tar.gz
          curl -fL --retry 3 -o jpeg.tar.gz https://www.ijg.org/files/jpegsrc.v9e.tar.gz
          curl -fL --retry 3 -o oniguruma.tar.gz https://github.com/kkos/oniguruma/releases/download/v6.9.10/onig-6.9.10.tar.gz
          curl -fL --retry 3 -o php.tar.gz https://www.php.net/distributions/php-8.5.10.tar.gz
          for archive in *.tar.gz *.tar.xz; do
            tar -xf "$archive"
          done

      - name: Build PHP
        run: |
          ./buildopenssl.sh
          ./buildiconv.sh
          ./buildxml.sh
          ./buildzlib.sh
          ./buildsqlite.sh
          ./buildpng.sh
          ./buildjpeg.sh
          ./buildonig.sh
          ./buildphp.sh

      - name: Build PHP Desktop
        run: ./cleanbuild.sh

      - name: Bundle dynamic libraries
        run: |
          APP="build_arm64/Release/PHP Desktop.app"
          dylibbundler -od -b -x "$APP/Contents/MacOS/php-cgi" -d "$APP/Contents/MacOS"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "PHP-Desktop-macOS-arm64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-desktop-macos-arm64
          path: PHP-Desktop-macOS-arm64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: PHP-Desktop-macOS-arm64.zip
